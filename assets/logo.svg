<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <style>
      .bg-white { fill: #ffffff; }
      .red-fill { fill: #E60000; }
      .black-fill { fill: #050505; }
      .black-stroke { stroke: #050505; stroke-width: 14; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base White Background Capsule shape -->
  <path d="M 200,10 
           L 300,10 
           A 190,190 0 0 1 390,200 
           L 390,300 
           A 190,190 0 0 1 200,490 
           A 190,190 0 0 1 10,300 
           L 10,200 
           A 190,190 0 0 1 200,10 Z" 
        class="bg-white" />

  <!-- Outer Capsule Border -->
  <path d="M 200,12 
           C 300,12 388,90 388,200 
           L 388,300 
           C 388,410 300,488 200,488 
           C 100,488 12,410 12,300 
           L 12,200 
           C 12,90 100,12 200,12 Z" 
        class="black-stroke" />

  <!-- ROOSTER HEAD (RED) -->
  <!-- Comb and Wattle -->
  <path class="red-fill" d="
    M 152,142 
    C 140,146 112,160 102,174 
    C 96,182 110,183 124,180 
    C 114,196 118,220 126,236 
    C 134,252 144,270 148,290 
    C 152,310 156,334 148,356 
    C 142,374 130,394 116,408 
    C 144,432 174,444 198,446 
    C 192,420 188,390 178,358 
    C 170,332 164,300 170,270 
    C 176,240 190,214 206,188 
    C 216,172 226,156 220,138 
    C 216,128 206,126 196,132 
    C 190,136 182,144 186,124 
    C 190,108 204,92 220,84 
    C 230,78 244,78 252,86 
    C 238,98 234,112 238,124 
    C 244,142 258,138 274,120 
    C 286,106 294,86 288,68 
    C 278,66 266,72 258,78 
    C 250,70 240,62 224,62 
    C 200,62 174,84 158,108 
    C 150,120 148,132 152,142 Z
  " />

  <!-- ROOSTER NECK / FEATHER ACCENT (BLACK) -->
  <path class="black-fill" d="
    M 218,154 
    C 238,154 252,168 260,188 
    C 272,216 262,246 250,272 
    C 240,294 228,314 218,336 
    C 210,354 204,374 202,394 
    C 218,374 232,352 248,330 
    C 264,306 282,280 286,248 
    C 290,218 280,188 262,164 
    C 252,150 236,138 218,154 Z
  " />

  <!-- Small Feather Notch (Black) -->
  <path class="black-fill" d="
    M 226,206 
    C 240,206 248,216 250,230 
    C 252,244 246,256 238,266 
    C 232,274 226,282 222,290 
    C 230,276 238,262 244,248 
    C 250,234 246,220 236,212 
    C 232,208 228,206 226,206 Z
  " />

  <!-- ROOSTER EYE (BLACK) -->
  <ellipse cx="196" cy="174" rx="10" ry="14" class="black-fill" transform="rotate(-15 196 174)" />
  <ellipse cx="193" cy="170" rx="3.5" ry="4.5" class="bg-white" />

  <!-- LOWER FARM FIELDS / HILL STRIPES (RED & BLACK) -->

  <!-- Black Field (Right Bottom) -->
  <path class="black-fill" d="
    M 212,342 
    C 256,312 310,296 364,298 
    C 382,324 390,356 388,388 
    C 354,432 308,464 256,478 
    C 288,432 304,380 306,328 
    C 272,346 238,368 212,342 Z
  " />
  
  <!-- Black Field Layers / Furrows -->
  <path d="M 268,386 C 314,358 358,348 388,358" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 308,430 C 342,408 372,398 386,408" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Red Field (Left & Bottom Main Curves) -->
  <path class="red-fill" d="
    M 12,304 
    C 80,304 150,332 208,374 
    C 160,422 104,460 38,474 
    C 24,444 14,410 12,374 
    L 12,304 Z
  " />
  
  <path class="red-fill" d="
    M 38,474 
    C 104,460 160,422 208,374 
    C 220,382 230,392 238,404 
    C 188,446 128,478 62,488 
    C 54,484 46,480 38,474 Z
  " />

  <path class="red-fill" d="
    M 62,488 
    C 128,478 188,446 238,404 
    C 244,412 248,422 252,432 
    C 200,468 140,492 78,494 
    C 72,492 66,490 62,488 Z
  " />

  <!-- White Separator Lines for Red Fields -->
  <path d="M 12,356 C 88,356 160,390 220,436" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M 32,424 C 98,424 168,450 236,478" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" />

</svg>
